<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // tema salvato, altrimenti quello del sistema: prima di tutto il resto, così non lampeggia
      (function () {
        var key = "appsolute-theme", t = null;
        try { t = localStorage.getItem(key); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppSolute · free and open source apps</title>
    <meta name="description" content="AppSolute is a group of six students from ITIS G. Cardano in Pavia, Italy, building free and open source apps. Our first project is WingPal." />
    <link rel="alternate" hreflang="en" href="https://appsolutelab.github.io/appsolute-landing/en/" />
    <link rel="alternate" hreflang="it" href="https://appsolutelab.github.io/appsolute-landing/" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
